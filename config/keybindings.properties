# Key bindings: p<player>.<ACTION> = key, key
# A key is one printable character (letters ignore case) or one of:
#   UP, DOWN, LEFT, RIGHT, ENTER, ESCAPE, SPACE, BACKSPACE, TAB
# A key may be bound only once. Every action needs a key for p1.
# Menus use MOVE_UP and MOVE_DOWN to move the selection.

p1.MOVE_UP       = w, UP
p1.MOVE_DOWN     = s, DOWN
p1.MOVE_LEFT     = a, LEFT
p1.MOVE_RIGHT    = d, RIGHT
p1.PLACE_BOMB    = b, SPACE
p1.SELECT_NORMAL = n
p1.SELECT_PUMPED = e
p1.SELECT_REMOTE = r
p1.DETONATE      = q
p1.PAUSE         = p, ESCAPE
p1.CONFIRM       = ENTER
p1.BACK          = BACKSPACE
